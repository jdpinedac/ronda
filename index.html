<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2E8D6">
  <meta name="description" content="See who holds the floor. Speaker diarization that runs entirely in your browser.">
  <title>Ronda</title>
  <!-- Restores cross-origin isolation on hosts that cannot set COOP/COEP
       headers (GitHub Pages), enabling multi-threaded WASM. See ADR 0001. -->
  <script src="./coi-serviceworker.js"></script>
  <script>
    // Paint the remembered theme before the first frame, so the page does not
    // flash light before turning dark. src/ui/prefs.ts owns the logic.
    (function () {
      try {
        var t = localStorage.getItem('ronda.theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && dark) m.setAttribute('content', '#1C1712');
      } catch (e) { /* no storage: stay light */ }
    })();
  </script>
  <link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Ronda</h1>
      <p class="sub" id="tagline"></p>
      <p class="meta" id="release"></p>
    </header>

    <section class="card">
      <h2 id="live-cta"></h2>
      <p id="live-cta-body"></p>
      <a class="btn btn-go" href="./live.html" id="live-link"></a>
    </section>

    <section class="card">
      <h2 id="analyse-cta"></h2>
      <p id="analyse-cta-body"></p>
      <a class="btn btn-go" href="./analyze.html" id="analyse-link"></a>
    </section>

    <section>
      <h2 id="device-title"></h2>
      <div id="status" class="status"></div>
    </section>

    <footer id="footer">
      <a href="https://github.com/jdpinedac/ronda">github.com/jdpinedac/ronda</a> · <span id="version"></span>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
