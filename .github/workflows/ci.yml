name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      # onnxruntime-web is the only runtime dependency and should stay clean.
      # Dev-only advisories are reported but do not fail the build.
      - run: npm audit --omit=dev --audit-level=high
