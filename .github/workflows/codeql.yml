# Static analysis of the TypeScript and the build scripts, on every change and
# weekly. Findings appear under Security → Code scanning. This is a release
# candidate people are trying; it should not ship anything CodeQL would flag.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
